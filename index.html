<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizard Typing Game - Arcane Defense</title>
    <link rel="stylesheet" href="index.css">
    <script src="game.js" defer></script>
   
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="900" height="600"></canvas>

        <!-- Start Screen -->
        <div id="startScreen" class="overlay">
            <h1>DON'T DIE: ARCANE CHANT</h1>
            <p>Type spell chants to destroy approaching monsters.</p>
            <p>Match spell elements to enemy types to survive!</p>
            <div class="stats-box">
                <p>HIGH SCORE: <span id="startHighScore" style="color: #f1c40f; font-weight: bold;">0</span></p>
            </div>
            <button class="btn" onclick="startGame()">START GAME</button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="overlay hidden">
            <h1 style="color: #e74c3c; text-shadow: 0 0 10px rgba(231, 76, 60, 0.5);">YOU DIED</h1>
            <div class="stats-box">
                <p>FINAL SCORE: <span id="finalScore" style="color: #2ecc71; font-weight: bold;">0</span></p>
                <p>SURVIVED TIME: <span id="finalTime" style="color: #3498db;">0s</span></p>
                <p>HIGH SCORE: <span id="endHighScore" style="color: #f1c40f; font-weight: bold;">0</span></p>
            </div>
            <button class="btn" onclick="startGame()">PLAY AGAIN</button>
        </div>
    </div>


</body>
</html>
